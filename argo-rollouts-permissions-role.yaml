apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-permissions
  namespace: collector
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list", "get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["list", "get"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["list", "get"]

